name: AI Issue to Production PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-change-scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Include the old path of renamed files so moving a runtime file
          # out of a runtime directory is still classified as runtime.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
          python scripts/classify_change_scope.py --files-from changed-files.txt --github-output

  process-check:
    name: PR process lint
    runs-on: ubuntu-latest
    needs: detect-change-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ai_process_lint.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --target-branch dev \
            --scope "${{ needs.detect-change-scope.outputs.scope }}"

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    needs: detect-change-scope
    if: needs.detect-change-scope.outputs.scope != 'docs-only'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process script tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          bash -n scripts/deploy-images.sh
          python -m unittest discover -s scripts/tests -v

      - name: Lint changed files
        run: |
          set -euo pipefail
          pip install --quiet pre-commit
          pre-commit run --show-diff-on-failure \
            --from-ref "${{ github.event.pull_request.base.sha }}" \
            --to-ref "${{ github.event.pull_request.head.sha }}"

  pr-check:
    name: PR check passed
    runs-on: ubuntu-latest
    needs: [detect-change-scope, process-check, repo-checks]
    if: always()
    steps:
      - name: Evaluate results
        env:
          SCOPE: ${{ needs.detect-change-scope.outputs.scope }}
          DETECT_RESULT: ${{ needs.detect-change-scope.result }}
          PROCESS_RESULT: ${{ needs.process-check.result }}
          REPO_RESULT: ${{ needs.repo-checks.result }}
        run: |
          set -euo pipefail
          echo "scope=${SCOPE} detect=${DETECT_RESULT} process=${PROCESS_RESULT} repo=${REPO_RESULT}"
          # Every job that should run must succeed; cancelled or unexpectedly
          # skipped jobs fail this check instead of passing silently.
          if [ "${DETECT_RESULT}" != "success" ]; then
            echo "Change scope detection did not succeed." >&2
            exit 1
          fi
          if [ "${PROCESS_RESULT}" != "success" ]; then
            echo "PR process lint did not succeed." >&2
            exit 1
          fi
          if [ "${REPO_RESULT}" = "skipped" ] && [ "${SCOPE}" = "docs-only" ]; then
            echo "Repository checks skipped for docs-only change."
          elif [ "${REPO_RESULT}" != "success" ]; then
            echo "Repository checks did not succeed." >&2
            exit 1
          fi
          echo "All PR checks passed."
