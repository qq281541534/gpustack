name: ❓ 问题咨询
description: 咨询 GPUStack 相关问题
type: "Question"
assignees: [ ]

body:
  - type: markdown
    attributes:
      value: |
        有关于 GPUStack 的问题？请补充以下信息，方便我们更快理解和回复。

  - type: textarea
    id: question
    attributes:
      label: 📝 你的问题
      description: 请清晰、简洁地描述你的问题。
      placeholder: 请在这里填写你的问题...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 🔍 补充背景
      description: 请补充相关细节、示例或截图，帮助我们理解你的问题。
      placeholder: 可选的补充背景...
    validations:
      required: false
