name: 📚 文档更新
description: 请求更新或改进 GPUStack 文档
type: "Documentation"
assignees: [ ]

body:
  - type: markdown
    attributes:
      value: |
        需要更新文档？请补充以下信息，帮助我们改进文档。

  - type: textarea
    id: related-problem
    attributes:
      label: ❓ 相关问题或 Issue
      description: 请描述相关问题，或填写相关 Issue 编号。
      placeholder: 可选，例如 "Related to issue #123"
    validations:
      required: false

  - type: textarea
    id: update-description
    attributes:
      label: 💡 更新说明
      description: 请简明描述你希望如何更新文档。
      placeholder: 请说明希望修改或补充的文档内容...
    validations:
      required: true
