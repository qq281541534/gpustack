name: 💡 功能增强建议
description: 提出对现有功能的改进或增强建议
type: "Enhancement"
assignees: [ ]

body:
  - type: markdown
    attributes:
      value: |
        🙏 Thanks for suggesting an enhancement!  
        感谢你提出功能增强建议。请补充以下信息，方便我们理解你的想法。

  - type: textarea
    id: related-problem
    attributes:
      label: ❓ 这个增强是否和某个问题有关？
      description: |
        请简明描述相关问题。
        例如："当 [...] 时，我经常遇到不便。"
      placeholder: 请描述这个建议要解决的问题...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 💡 期望的解决方案
      description: 请简明描述你希望如何改进。
      placeholder: 请说明你的方案或期望行为...
    validations:
      required: false
